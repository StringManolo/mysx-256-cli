[package]
name = "mysx-cli"
version = "0.1.0"
edition = "2021"
description = "CLI to encrypt/decrypt files with MYSX-256/512 (EXPERIMENTAL, NOT AUDITED)"

[lib]
name = "mysx_cli"
path = "src/lib.rs"

[[bin]]
name = "mysx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
